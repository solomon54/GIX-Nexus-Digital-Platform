<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark navy background with slight rounding -->
  <rect width="32" height="32" rx="6" ry="6" fill="#0a1628"/>
  <!-- Thin accent border -->
  <rect width="32" height="32" rx="6" ry="6" fill="none" stroke="#1a3a6b" stroke-width="1"/>
  <!-- GIX text rendered as bold white letters with brand colors -->
  <text x="4" y="22" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="14" fill="white" letter-spacing="-0.5">G</text>
  <text x="13" y="22" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="14" fill="#3b82f6" letter-spacing="-0.5">I</text>
  <text x="18" y="22" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="14" fill="#22c55e" letter-spacing="-0.5">X</text>
  <!-- Small accent line under -->
  <rect x="4" y="24" width="24" height="2" rx="1" fill="#3b82f6" opacity="0.6"/>
</svg>
